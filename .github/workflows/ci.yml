name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Pytest
        run: pytest

      # Non-blocking on purpose: retrieval quality moves for legitimate
      # reasons, so a drop is information to look at, not a reason to fail a
      # build. The number is in the job log.
      - name: Retrieval evaluation
        continue-on-error: true
        run: python -m app.ai.eval.run_eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs tsc --noEmit before vite, so this is the type
      # check and the bundle in one step -- and a build that fails to produce
      # a bundle is the thing Cloudflare Pages would fail on anyway.
      - name: Type check and build
        run: npm run build
