[project]
name = "ai-workspace-assistant"
version = "0.1.0"
description = "Multi-tenant AI workspace assistant — RAG plus a human-in-the-loop agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "pyjwt==2.13.0",
    "cryptography==50.0.0",
    "email-validator==2.3.0",
    "aioboto3==15.5.0",
    "python-multipart==0.0.32",
    "pgvector==0.5.0",
    "pypdf==6.16.2",
    "python-docx==1.2.0",
    "langchain-google-genai==4.3.5",
    "langchain==1.3.16",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "types-pyyaml==6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Alembic's own autogenerate output isn't hand-wrapped -- rewrapping it by
# hand on every future migration would risk transcription errors for no
# benefit, so only line-length is exempted here.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Neither ships py.typed or stubs; botocore's client surface is generated at
# runtime and isn't meaningfully typeable regardless.
module = ["aioboto3", "aioboto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python-docx installs as the module `docx` and ships no py.typed marker.
module = ["docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The engine in app/database/session.py is a module-level singleton whose
# pooled connections are bound to whichever event loop first used them. The
# pytest-asyncio default is a fresh loop per test function, which orphans
# those connections the moment the next test's loop starts ("Event loop is
# closed") -- pinning both scopes to the session keeps one loop for the
# engine's whole lifetime, same as it has in the running app.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]
