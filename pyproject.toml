[project]
name = "ai-workspace-assistant"
version = "0.1.0"
description = "Multi-tenant AI workspace assistant — RAG plus a human-in-the-loop agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
